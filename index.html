<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자리바꾸기</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
<style>
  :root{
    --bg:#EDE7DA;
    --panel:#FFFFFF;
    --ink:#25302B;
    --ink-soft:#6B7269;
    --board:#2F5D50;
    --board-dark:#234A3F;
    --accent:#E3A62F;
    --accent-soft:#F6DFA3;
    --danger:#B5533C;
    --line:#DAD2BE;
    --seat-border:#CFC6AE;
    --seat-empty:#F5F1E6;
    --unused-bg:#D9D3C4;
    --pin:#D98E3B;
    --male:#3E6FD1;
    --female:#D1477A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Malgun Gothic','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  header{
    background:var(--board);
    background-image:linear-gradient(180deg,var(--board),var(--board-dark));
    color:#F4EFE2;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    box-shadow:0 3px 8px rgba(0,0,0,.18);
  }
  .title-wrap{display:flex;align-items:baseline;gap:10px;}
  .title-wrap .deco{font-size:20px;}
  #titleInput{
    background:transparent;
    border:none;
    border-bottom:2px dashed rgba(244,239,226,.5);
    color:#F4EFE2;
    font-size:22px;
    font-weight:700;
    padding:2px 4px;
    width:250px;
    font-family:inherit;
  }
  #titleInput:focus{outline:none;border-bottom-color:var(--accent);}
  .toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
  .btn{
    border:none;
    border-radius:8px;
    padding:9px 13px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:transform .08s ease, box-shadow .08s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-light{background:#F4EFE2;color:var(--board-dark);}
  .btn-light:hover{background:#fff;}
  .btn-accent{background:var(--accent);color:#2E2410;}
  .btn-accent:hover{box-shadow:0 0 0 2px rgba(227,166,47,.4) inset;}
  .print-hint{font-size:11px;color:#CFE3DA;max-width:110px;line-height:1.4;}

  main{
    display:flex;
    gap:20px;
    padding:22px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  /* ---------- Seating panel ---------- */
  .seat-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 24px 26px;
    flex:1 1 560px;
  }
  .panel-heading-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
  }
  .panel-heading{
    font-size:15px;
    font-weight:700;
    color:var(--ink-soft);
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel-heading .front-arrow{color:var(--accent);}
  .layout-select-wrap{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;color:var(--ink-soft);
  }
  #layoutSelect{
    border:1px solid var(--line);
    border-radius:7px;
    padding:5px 7px;
    font-size:12.5px;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
  }

  .seating-grid{
    display:grid;
    gap:8px;
    justify-content:center;
  }
  .seat{
    position:relative;
    background:var(--seat-empty);
    border:1.5px solid var(--seat-border);
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:4px;
    text-align:center;
    user-select:none;
    transition:border-color .12s ease, background .12s ease, box-shadow .12s ease;
  }
  .seat:hover{border-color:var(--board);}
  .seat.selected{
    border-color:var(--board);
    box-shadow:0 0 0 3px rgba(47,93,80,.28);
    background:#E7F0EC;
  }
  .seat.drag-over{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(227,166,47,.35);
  }
  .seat.pinned{border-color:var(--pin);}
  .seat.pinned::before{
    content:"";
    position:absolute;
    top:0;left:0;
    border-width:0 0 16px 16px;
    border-style:solid;
    border-color:transparent transparent var(--pin) transparent;
    border-bottom-left-radius:6px;
  }
  .seat.unused{
    background:repeating-linear-gradient(45deg,var(--unused-bg),var(--unused-bg) 6px,#cfc9ba 6px,#cfc9ba 12px);
    border-style:dashed;
    cursor:default;
  }
  .seat-tools{
    position:absolute;
    top:2px;
    right:2px;
    display:flex;
    gap:2px;
  }
  .seat-tools button{
    width:20px;height:20px;
    border:none;
    border-radius:5px;
    background:rgba(255,255,255,.75);
    font-size:11px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:.55;
  }
  .seat-tools button:hover{opacity:1;}
  .seat.pinned .pin-btn{background:var(--pin);opacity:1;}
  .seat.unused .unused-btn{background:var(--danger);color:#fff;opacity:1;}

  .seat-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    width:100%;
    height:100%;
  }
  .seat-body[draggable="true"]{cursor:grab;}
  .seat-body:active{cursor:grabbing;}
  .seat-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .seat-name.g-남{color:var(--male);}
  .seat-name.g-여{color:var(--female);}
  .unused-label{font-size:12px;color:#6b6558;font-weight:700;}

  .podium{
    background:#F1EADA;
    border:1.5px solid var(--seat-border);
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:2px;
  }

  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-top:18px;
    font-size:12px;
    color:var(--ink-soft);
  }
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend .dot{width:12px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid var(--seat-border);}
  .legend .dot.male{background:var(--male);border-color:var(--male);}
  .legend .dot.female{background:var(--female);border-color:var(--female);}

  /* ---------- Roster panel ---------- */
  .roster-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px 16px;
    flex:0 0 320px;
  }
  .teacher-info{
    display:flex;
    gap:6px;
    margin-bottom:10px;
  }
  .teacher-info input{
    border:1px solid var(--line);
    border-radius:6px;
    padding:5px 7px;
    font-size:12px;
    font-family:inherit;
    color:var(--ink);
  }
  .teacher-info input#gradeInput{width:52px;}
  .teacher-info input#classInput{width:46px;}
  .teacher-info input#teacherInput{flex:1;min-width:0;}
  .teacher-info input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  .roster-hint{
    font-size:10.5px;
    color:var(--ink-soft);
    margin:0 0 8px;
    line-height:1.4;
  }
  .roster-table{
    max-height:560px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:6px;
  }
  .roster-row{
    display:flex;
    align-items:stretch;
    border-bottom:1px solid var(--line);
  }
  .roster-row:last-child{border-bottom:none;}
  .roster-row.head{
    background:var(--board);
    color:#F4EFE2;
    font-size:10.5px;
    font-weight:700;
    text-align:center;
    position:sticky;top:0;z-index:1;
  }
  .roster-row.head > div{padding:4px 0;}
  .roster-row input, .roster-row select{
    border:none;
    border-right:1px solid var(--line);
    padding:2px 5px;
    font-size:11px;
    font-family:inherit;
    text-align:center;
    background:transparent;
    color:var(--ink);
    white-space:nowrap;
    min-width:0;
    height:23px;
  }
  .roster-row > *:last-child{border-right:none;}
  .roster-row input:focus, .roster-row select:focus{outline:2px solid var(--accent);outline-offset:-2px;}
  .col-no{flex:0 0 34px;}
  .col-name{flex:1 1 auto;text-align:left;overflow:hidden;text-overflow:ellipsis;}
  .col-gender{flex:0 0 40px;}
  .roster-row.head .col-no{flex:0 0 34px;}
  .roster-row.head .col-name{flex:1 1 auto;}
  .roster-row.head .col-gender{flex:0 0 40px;}
  .roster-row:nth-child(even){background:#FBF9F3;}

  /* ---------- Settings modal ---------- */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(37,48,43,.45);
    align-items:center;justify-content:center;
    z-index:50;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;
    border-radius:12px;
    padding:24px 26px;
    width:340px;
    box-shadow:0 12px 30px rgba(0,0,0,.25);
  }
  .modal h2{margin:0 0 4px;font-size:17px;}
  .modal p.sub{margin:0 0 18px;font-size:12px;color:var(--ink-soft);}
  .field-group{margin-bottom:18px;}
  .field-group > label.group-label{
    display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink);
  }
  .toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:#F5F1E6;border-radius:8px;padding:10px 12px;
  }
  .switch{
    position:relative;width:40px;height:22px;flex-shrink:0;
  }
  .switch input{opacity:0;width:0;height:0;}
  .slider{
    position:absolute;inset:0;background:#CFC6AE;border-radius:22px;cursor:pointer;transition:.15s;
  }
  .slider::before{
    content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;
  }
  .switch input:checked + .slider{background:var(--board);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .radio-opt{
    display:flex;align-items:center;gap:8px;
    padding:9px 10px;border-radius:8px;margin-bottom:6px;
    background:#F5F1E6;cursor:pointer;font-size:13px;
  }
  .radio-opt:hover{background:#F0E9D8;}
  .radio-opt input{accent-color:var(--board);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  /* ---------- Countdown overlay ---------- */
  .countdown-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(35,46,41,.82);
    align-items:center;justify-content:center;
    z-index:60;
  }
  .countdown-overlay.show{display:flex;}
  .count-num{
    font-size:120px;font-weight:800;color:#F4EFE2;
    text-shadow:0 4px 18px rgba(0,0,0,.4);
  }

  /* ---------- Print ---------- */
  .print-area{display:none;}
  @media print{
    @page{ size:A4 landscape; margin:9mm; }
    body > *{ display:none !important; }
    body > .print-area{ display:block !important; width:100%; }
    .print-title{
      width:236mm;
      text-align:center;
      font-size:22px; font-weight:800; color:#1a1a1a;
      margin:0 0 5mm 0;
    }
    .print-body{
      display:flex;
      gap:8mm;
    }
    .print-seating-grid{
      display:grid;
      width:236mm;
      flex:0 0 236mm;
      gap:2.4mm;
      margin-top:13.6mm;
    }
    .print-seat{
      border:1.3px solid #999;
      border-radius:2mm;
      display:flex;align-items:center;justify-content:center;
      flex-direction:column;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .print-seat.unused{background:transparent;border:none;}
    .print-seat .p-name{font-weight:700;font-size:15px;white-space:nowrap;}
    .print-seat .p-name.g-남{color:var(--male);}
    .print-seat .p-name.g-여{color:var(--female);}
    .print-podium{
      border:1.3px solid #999;border-radius:2mm;
      display:flex;align-items:center;justify-content:center;
      font-weight:700;letter-spacing:2px;color:#555;
    }
    .print-roster-panel{
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      min-width:0;
    }
    .print-roster-meta{
      font-size:13px;
      font-weight:700;
      color:#222;
      margin-bottom:2.5mm;
      border-bottom:1.3px solid #999;
      padding-bottom:2mm;
      white-space:nowrap;
      overflow:hidden;
    }
    .print-roster-meta span{ margin-right:4mm; font-weight:400; color:#444; white-space:nowrap; }
    .print-roster-table{ width:100%; border-collapse:collapse; table-layout:fixed; }
    .print-roster-table col.col-no{ width:9.2mm; }
    .print-roster-table col.col-gender{ width:9.2mm; }
    .print-roster-table th, .print-roster-table td{
      border:1px solid #aaa;
      font-size:9px;
      padding:0;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      color:#1a1a1a;
      height:4.6mm;
      line-height:4.6mm;
    }
    .print-roster-table th{ background:#e8e3d5; -webkit-print-color-adjust:exact;print-color-adjust:exact; }
    .print-roster-table td.name-cell{ padding:0 0.8mm; }
  }
</style>
</head>
<body>

<header>
  <div class="title-wrap">
    <span class="deco">☺</span>
    <input id="titleInput" value="우리반 자리배치표" />
    <span class="deco">☺</span>
  </div>
  <div class="toolbar">
    <button class="btn btn-light" onclick="openSettings()">⚙ 설정</button>
    <button class="btn btn-accent" onclick="assignSeats()">🔀 자리바꾸기</button>
    <button class="btn btn-light" onclick="sortBySeatNumber('vertical')">🔢 세로 번호배치</button>
    <button class="btn btn-light" onclick="sortBySeatNumber('horizontal')">🔢 가로 번호배치</button>
    <button class="btn btn-light" onclick="resetSeats()">↺ 초기화</button>
    <button class="btn btn-light" onclick="exportExcel()">⬇ 저장</button>
    <button class="btn btn-light" onclick="printChart()" title="인쇄 대화상자에서 용지 방향은 자동으로 '가로'가 적용됩니다.">🖨 인쇄</button>
    <span class="print-hint">인쇄 대화상자에서 "머리글과 바닥글"을 꺼주세요 (주소/페이지번호 제거). 용지 방향은 자동으로 가로로 맞춰져요</span>
  </div>
</header>

<main>
  <section class="seat-panel">
    <div class="panel-heading-row">
      <p class="panel-heading"><span class="front-arrow">▲</span> 뒤쪽 — 교탁(앞쪽)은 아래에 있어요</p>
      <div class="layout-select-wrap">
        <label for="layoutSelect">자리 배치 형태</label>
        <select id="layoutSelect" onchange="changeLayout(this.value)">
          <option value="pairs" selected>2인 3분단형 (2명×5줄×3분단)</option>
          <option value="solo5">1인 5분단형 (1명×6줄×5분단)</option>
          <option value="solo6">1인 6분단형 (1명×5줄×6분단)</option>
        </select>
      </div>
    </div>
    <div class="seating-grid" id="seatingGrid"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--seat-empty)"></span> 빈 자리</span>
      <span><span class="dot" style="background:#fff;border-color:var(--pin)"></span> 📌 고정 자리</span>
      <span><span class="dot" style="background:var(--unused-bg)"></span> 🚫 미사용 자리</span>
      <span><span class="dot male"></span> 남학생</span>
      <span><span class="dot female"></span> 여학생</span>
      <span>자리를 클릭하거나 마우스로 끌어다 놓으면 자리를 바꿀 수 있어요</span>
    </div>
  </section>

  <section class="roster-panel">
    <p class="panel-heading">📋 명렬표</p>
    <div class="teacher-info">
      <input id="gradeInput" placeholder="학년" />
      <input id="classInput" placeholder="반" />
      <input id="teacherInput" placeholder="담임 선생님 이름" />
    </div>
    <p class="roster-hint">엑셀 명렬표(번호·이름·성별)를 그대로 복사해서 번호 칸에 붙여넣으면 자동으로 채워져요.</p>
    <div class="roster-table" id="rosterTable"></div>
  </section>
</main>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h2>⚙ 자리바꾸기 설정</h2>
    <p class="sub">자리바꾸기 버튼을 눌렀을 때 적용될 방식이에요.</p>

    <div class="field-group">
      <label class="group-label">카운트다운</label>
      <div class="toggle-row">
        <span>자리바꾸기 전 3초 카운트다운</span>
        <label class="switch">
          <input type="checkbox" id="countdownToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="field-group">
      <label class="group-label">배치 방식</label>
      <label class="radio-opt"><input type="radio" name="mode" value="mixed" /> 남녀 배치 (짝을 남녀로)</label>
      <label class="radio-opt"><input type="radio" name="mode" value="same" /> 같은 성별 배치 (짝을 동성으로)</label>
      <label class="radio-opt"><input type="radio" name="mode" value="random" checked /> 랜덤 배치 (성별 상관없이)</label>
    </div>

    <div class="modal-actions">
      <button class="btn btn-light" onclick="closeSettings()">닫기</button>
      <button class="btn btn-accent" onclick="saveSettings()">저장</button>
    </div>
  </div>
</div>

<!-- Countdown overlay -->
<div class="countdown-overlay" id="countdownOverlay">
  <div class="count-num">3</div>
</div>

<!-- Print-only area -->
<div class="print-area" id="printArea">
  <div class="print-title" id="printTitle"></div>
  <div class="print-body">
    <div class="print-seating-grid" id="printGrid"></div>
    <div class="print-roster-panel">
      <div class="print-roster-meta" id="printMeta"></div>
      <table class="print-roster-table">
        <colgroup>
          <col class="col-no" />
          <col class="col-name" />
          <col class="col-gender" />
        </colgroup>
        <thead><tr><th>번호</th><th>이름</th><th>성별</th></tr></thead>
        <tbody id="printRosterBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
/* ---------------- state ---------------- */
const SEAT_COUNT = 30;
let roster = Array.from({length:SEAT_COUNT}, () => ({no:'', name:'', gender:''}));
let seats  = Array.from({length:SEAT_COUNT}, () => ({studentIdx:null, pinned:false, unused:false}));
let selectedSeat = null;
let dragSeat = null;
let currentLayout = 'pairs'; // 'pairs' | 'solo5' | 'solo6'
let settings = { countdown:true, mode:'random' };

const seatingGrid = document.getElementById('seatingGrid');
const rosterTable  = document.getElementById('rosterTable');
const titleInput   = document.getElementById('titleInput');

/* ---------------- layout helpers ---------------- */
function colsOfLayout(layout){
  if(layout === 'solo5') return 5;
  return 6; // pairs, solo6
}
function rowsOfLayout(layout){
  if(layout === 'solo5') return 6;
  return 5; // pairs, solo6
}
function seatIndexAt(row, col, layout){
  layout = layout || currentLayout;
  if(layout === 'pairs'){
    const g = Math.floor(col/2), s = col%2;
    return g*10 + row*2 + s;
  }
  const cols = colsOfLayout(layout);
  return row*cols + col;
}
function seatColOf(i, layout){
  layout = layout || currentLayout;
  if(layout === 'pairs'){
    const g = Math.floor(i/10), rem = i%10, s = rem%2;
    return g*3 + s + 1;
  }
  const cols = colsOfLayout(layout);
  return (i % cols) + 1;
}
function seatRowOf(i, layout){
  layout = layout || currentLayout;
  if(layout === 'pairs'){
    const rem = i%10, r = Math.floor(rem/2);
    return r + 1;
  }
  const cols = colsOfLayout(layout);
  return Math.floor(i/cols) + 1;
}
function pairIdOf(i, layout){
  layout = layout || currentLayout;
  if(layout === 'pairs'){
    const g = Math.floor(i/10), rem = i%10, r = Math.floor(rem/2);
    return g*5 + r;
  }
  const cols = colsOfLayout(layout);
  const col = i % cols, row = Math.floor(i/cols);
  const perRow = Math.ceil(cols/2);
  return row*perRow + Math.floor(col/2);
}
function gridColumnsCss(layout){
  if(layout === 'pairs') return '92px 92px 20px 92px 92px 20px 92px 92px';
  return `repeat(${colsOfLayout(layout)}, 94px)`;
}
function gridRowsCss(layout){
  return `repeat(${rowsOfLayout(layout)}, 68px) 20px 46px`;
}
function podiumGridArea(layout){
  const podRow = String(rowsOfLayout(layout) + 2);
  if(layout === 'pairs') return { col: '4 / span 2', row: podRow };
  if(layout === 'solo6') return { col: '3 / span 2', row: podRow };
  if(layout === 'solo5') return { col: '2 / span 3', row: podRow };
  return { col: '1 / span 2', row: podRow };
}
function changeLayout(value){
  currentLayout = value;
  selectedSeat = null;
  renderSeats();
}

/* ---------------- generic helpers ---------------- */
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function orderVertical(layout){
  const cols = colsOfLayout(layout), rows = rowsOfLayout(layout);
  const order = [];
  for(let col=cols-1; col>=0; col--){
    for(let row=rows-1; row>=0; row--){
      order.push(seatIndexAt(row, col, layout));
    }
  }
  return order;
}
function orderHorizontal(layout){
  const cols = colsOfLayout(layout), rows = rowsOfLayout(layout);
  const order = [];
  for(let row=rows-1; row>=0; row--){
    for(let col=cols-1; col>=0; col--){
      order.push(seatIndexAt(row, col, layout));
    }
  }
  return order;
}

/* ---------------- roster rendering ---------------- */
function renderRoster(){
  let html = `<div class="roster-row head"><div class="col-no">번호</div><div class="col-name">이름</div><div class="col-gender">성별</div></div>`;
  roster.forEach((row, i) => {
    html += `<div class="roster-row">
      <input class="col-no" data-col="0" data-row="${i}" value="${escapeAttr(row.no)}" onchange="updateRoster(${i},'no',this.value)" onpaste="handlePaste(event,${i},0)" />
      <input class="col-name" data-col="1" data-row="${i}" value="${escapeAttr(row.name)}" onchange="updateRoster(${i},'name',this.value)" onpaste="handlePaste(event,${i},1)" />
      <select class="col-gender" data-col="2" data-row="${i}" onchange="updateRoster(${i},'gender',this.value)" onpaste="handlePaste(event,${i},2)">
        <option value="" ${row.gender===''?'selected':''}></option>
        <option value="남" ${row.gender==='남'?'selected':''}>남</option>
        <option value="여" ${row.gender==='여'?'selected':''}>여</option>
      </select>
    </div>`;
  });
  rosterTable.innerHTML = html;
}
function escapeAttr(v){ return (v||'').toString().replace(/"/g,'&quot;'); }

function updateRoster(i, field, value){
  roster[i][field] = value;
}

function handlePaste(e, rowIdx, colIdx){
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if(!text) return;
  e.preventDefault();
  let lines = text.split(/\r\n|\n|\r/);
  while(lines.length && lines[lines.length-1] === '') lines.pop();
  lines.forEach((line, li) => {
    const target = rowIdx + li;
    if(target >= SEAT_COUNT) return;
    const cells = line.split('\t');
    cells.forEach((cell, ci) => {
      const col = colIdx + ci;
      if(col > 2) return;
      const val = cell.trim();
      if(col === 0) roster[target].no = val;
      else if(col === 1) roster[target].name = val;
      else if(col === 2){
        let g = val;
        const gl = g.toLowerCase ? g.toLowerCase() : g;
        if(['남','남자','m','male'].includes(gl)) g='남';
        else if(['여','여자','f','female'].includes(gl)) g='여';
        else if(g!=='남' && g!=='여') g='';
        roster[target].gender = g;
      }
    });
  });
  renderRoster();
}

/* ---------------- seat rendering ---------------- */
function renderSeats(){
  seatingGrid.style.gridTemplateColumns = gridColumnsCss(currentLayout);
  seatingGrid.style.gridTemplateRows = gridRowsCss(currentLayout);

  let html = '';
  for(let i=0;i<SEAT_COUNT;i++){
    const seat = seats[i];
    const col = seatColOf(i), row = seatRowOf(i);
    let cls = 'seat';
    if(seat.pinned) cls += ' pinned';
    if(seat.unused) cls += ' unused';
    if(selectedSeat === i) cls += ' selected';

    let body = '';
    const hasStudent = seat.studentIdx !== null && roster[seat.studentIdx] && roster[seat.studentIdx].name;
    if(seat.unused){
      body = `<span class="unused-label">미사용</span>`;
    } else if(hasStudent){
      const st = roster[seat.studentIdx];
      const label = st.no ? `${escapeAttr(st.no)} ${escapeAttr(st.name)}` : escapeAttr(st.name);
      body = `<div class="seat-name g-${st.gender}">${label}</div>`;
    }

    const draggable = (!seat.unused) ? 'true' : 'false';

    html += `<div class="${cls}" style="grid-column:${col};grid-row:${row};"
      ondragover="onSeatDragOver(event,${i})" ondragleave="onSeatDragLeave(event,${i})" ondrop="onSeatDrop(event,${i})">
      <div class="seat-tools">
        <button class="pin-btn" title="고정" onclick="event.stopPropagation();togglePin(${i})">📌</button>
        <button class="unused-btn" title="미사용" onclick="event.stopPropagation();toggleUnused(${i})">🚫</button>
      </div>
      <div class="seat-body" draggable="${draggable}"
        onclick="selectSeat(${i})"
        ondragstart="onSeatDragStart(event,${i})"
        ondragend="onSeatDragEnd(event,${i})">${body}</div>
    </div>`;
  }
  const pod = podiumGridArea(currentLayout);
  html += `<div class="podium" style="grid-column:${pod.col};grid-row:${pod.row};">교 탁</div>`;
  seatingGrid.innerHTML = html;
}

function togglePin(i){
  seats[i].pinned = !seats[i].pinned;
  if(seats[i].pinned) seats[i].unused = false;
  renderSeats();
}
function toggleUnused(i){
  seats[i].unused = !seats[i].unused;
  if(seats[i].unused){
    seats[i].pinned = false;
    seats[i].studentIdx = null;
    if(selectedSeat === i) selectedSeat = null;
  }
  renderSeats();
}
function selectSeat(i){
  if(seats[i].unused) return;
  if(selectedSeat === null){
    selectedSeat = i;
  } else if(selectedSeat === i){
    selectedSeat = null;
  } else {
    swapSeats(selectedSeat, i);
    selectedSeat = null;
  }
  renderSeats();
}
function swapSeats(a, b){
  if(seats[a].unused || seats[b].unused) return;
  const tmp = seats[a].studentIdx;
  seats[a].studentIdx = seats[b].studentIdx;
  seats[b].studentIdx = tmp;
}

/* ---------------- drag & drop swap ---------------- */
function onSeatDragStart(e, i){
  if(seats[i].unused){ e.preventDefault(); return; }
  dragSeat = i;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(i));
}
function onSeatDragOver(e, i){
  if(seats[i].unused) return;
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function onSeatDragLeave(e, i){
  e.currentTarget.classList.remove('drag-over');
}
function onSeatDrop(e, i){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const from = dragSeat !== null ? dragSeat : parseInt(e.dataTransfer.getData('text/plain'), 10);
  if(isNaN(from) || from === i) return;
  swapSeats(from, i);
  selectedSeat = null;
  dragSeat = null;
  renderSeats();
}
function onSeatDragEnd(){
  dragSeat = null;
  document.querySelectorAll('.seat.drag-over').forEach(el => el.classList.remove('drag-over'));
}

/* ---------------- seat assignment ---------------- */
function computePlacements(pool, availableSeats, mode){
  if(mode === 'random'){
    const students = shuffle(pool);
    const placements = [];
    availableSeats.forEach((seatIdx, idx) => {
      if(idx < students.length) placements.push({seatIdx, studentIdx: students[idx].idx});
    });
    return placements;
  }

  const pairsMap = {};
  availableSeats.forEach(i => {
    const pid = pairIdOf(i);
    (pairsMap[pid] = pairsMap[pid] || []).push(i);
  });
  const fullPairs = shuffle(Object.values(pairsMap).filter(a => a.length === 2));
  const halfSeats = shuffle(Object.values(pairsMap).filter(a => a.length !== 2).flat());

  let males = shuffle(pool.filter(s => s.gender === '남'));
  let females = shuffle(pool.filter(s => s.gender === '여'));
  let others = shuffle(pool.filter(s => s.gender !== '남' && s.gender !== '여'));

  const placements = [];
  const takeAny = () => males.pop() || females.pop() || others.pop() || null;

  fullPairs.forEach(pair => {
    let a=null, b=null;
    if(mode === 'mixed'){
      if(males.length && females.length){ a = males.pop(); b = females.pop(); }
      else { a = takeAny(); b = takeAny(); }
    } else {
      if(males.length >= 2){ a = males.pop(); b = males.pop(); }
      else if(females.length >= 2){ a = females.pop(); b = females.pop(); }
      else { a = takeAny(); b = takeAny(); }
    }
    const seatArr = shuffle(pair);
    if(a) placements.push({seatIdx: seatArr[0], studentIdx: a.idx});
    if(b) placements.push({seatIdx: seatArr[1], studentIdx: b.idx});
  });

  halfSeats.forEach(seatIdx => {
    const st = takeAny();
    if(st) placements.push({seatIdx, studentIdx: st.idx});
  });

  return placements;
}

function assignSeats(){
  const pinnedStudentSet = new Set();
  seats.forEach(s => { if(s.pinned && s.studentIdx !== null) pinnedStudentSet.add(s.studentIdx); });

  const pool = roster
    .map((r,i) => ({...r, idx:i}))
    .filter(r => r.name && r.name.trim() !== '' && !pinnedStudentSet.has(r.idx));

  const availableSeats = seats.map((s,i)=>i).filter(i => !seats[i].unused && !seats[i].pinned);
  availableSeats.forEach(i => seats[i].studentIdx = null);

  const placements = computePlacements(pool, availableSeats, settings.mode);

  const apply = () => {
    placements.forEach(p => { seats[p.seatIdx].studentIdx = p.studentIdx; });
    selectedSeat = null;
    renderSeats();
  };

  if(settings.countdown){
    runCountdown(apply);
  } else {
    apply();
  }
}

function sortBySeatNumber(orientation){
  const pinnedStudentSet = new Set();
  seats.forEach(s => { if(s.pinned && s.studentIdx !== null) pinnedStudentSet.add(s.studentIdx); });

  const pool = roster
    .map((r,i) => ({...r, idx:i}))
    .filter(r => r.name && r.name.trim() !== '' && !pinnedStudentSet.has(r.idx));

  pool.sort((a,b) => {
    const na = parseFloat(a.no), nb = parseFloat(b.no);
    const aValid = !isNaN(na), bValid = !isNaN(nb);
    if(aValid && bValid) return na - nb;
    if(aValid) return -1;
    if(bValid) return 1;
    return (a.no||'').localeCompare(b.no||'');
  });

  const order = orientation === 'vertical' ? orderVertical(currentLayout) : orderHorizontal(currentLayout);
  const availableSeats = order.filter(i => !seats[i].unused && !seats[i].pinned);
  availableSeats.forEach(i => seats[i].studentIdx = null);
  availableSeats.forEach((seatIdx, idx) => {
    if(idx < pool.length) seats[seatIdx].studentIdx = pool[idx].idx;
  });

  selectedSeat = null;
  renderSeats();
}

function runCountdown(callback){
  const overlay = document.getElementById('countdownOverlay');
  const numEl = overlay.querySelector('.count-num');
  let n = 3;
  numEl.textContent = n;
  overlay.classList.add('show');
  const timer = setInterval(() => {
    n--;
    if(n > 0){
      numEl.textContent = n;
    } else {
      clearInterval(timer);
      overlay.classList.remove('show');
      callback();
    }
  }, 1000);
}

function resetSeats(){
  if(!confirm('모든 자리 배치, 고정, 미사용 설정을 초기화할까요?')) return;
  seats = Array.from({length:SEAT_COUNT}, () => ({studentIdx:null, pinned:false, unused:false}));
  selectedSeat = null;
  renderSeats();
}

/* ---------------- settings modal ---------------- */
function openSettings(){
  document.getElementById('countdownToggle').checked = settings.countdown;
  document.querySelectorAll('input[name="mode"]').forEach(r => r.checked = (r.value === settings.mode));
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('show');
}
function saveSettings(){
  settings.countdown = document.getElementById('countdownToggle').checked;
  settings.mode = document.querySelector('input[name="mode"]:checked').value;
  closeSettings();
}

/* ---------------- excel export (ExcelJS: bordered, centered) ---------------- */
async function exportExcel(){
  const wb = new ExcelJS.Workbook();
  const thin = {style:'thin', color:{argb:'FF999999'}};
  const allBorder = {top:thin, left:thin, bottom:thin, right:thin};
  const centerMid = {horizontal:'center', vertical:'middle', wrapText:true};

  const grade = document.getElementById('gradeInput').value.trim();
  const cls = document.getElementById('classInput').value.trim();
  const teacher = document.getElementById('teacherInput').value.trim();

  /* ---- 명렬표 sheet ---- */
  const wsRoster = wb.addWorksheet('명렬표');
  let r = 1;
  if(grade || cls){
    wsRoster.getCell(r,1).value = `${grade}${grade?'학년 ':''}${cls}${cls?'반':''}`.trim();
    wsRoster.getCell(r,1).font = {bold:true, size:13};
    r++;
  }
  if(teacher){
    wsRoster.getCell(r,1).value = `담임: ${teacher}`;
    wsRoster.getCell(r,1).font = {bold:true, size:11};
    r++;
  }
  r++;
  const headRow = r;
  ['번호','이름','성별'].forEach((h,ci) => {
    const c = wsRoster.getCell(headRow, ci+1);
    c.value = h;
    c.font = {bold:true};
    c.alignment = centerMid;
    c.border = allBorder;
    c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FFE8E3D5'}};
  });
  roster.forEach((st, idx) => {
    const rn = headRow + 1 + idx;
    const cNo = wsRoster.getCell(rn,1); cNo.value = st.no; cNo.alignment = centerMid; cNo.border = allBorder;
    const cName = wsRoster.getCell(rn,2); cName.value = st.name; cName.alignment = centerMid; cName.border = allBorder;
    const cGen = wsRoster.getCell(rn,3); cGen.value = st.gender; cGen.alignment = centerMid; cGen.border = allBorder;
  });
  wsRoster.getColumn(1).width = 8;
  wsRoster.getColumn(2).width = 14;
  wsRoster.getColumn(3).width = 8;

  /* ---- 자리배치표 sheet ---- */
  const wsSeat = wb.addWorksheet('자리배치표');
  const cols = colsOfLayout(currentLayout);
  const rows = rowsOfLayout(currentLayout);
  const hasGutter = currentLayout === 'pairs';

  const colPos = [];
  let ec = 1;
  for(let c=0;c<cols;c++){
    colPos.push(ec);
    ec++;
    if(hasGutter && c % 2 === 1 && c !== cols-1) ec++;
  }
  const totalCols = ec - 1;
  for(let ci=1; ci<=totalCols; ci++){
    const isGutter = hasGutter && !colPos.includes(ci);
    wsSeat.getColumn(ci).width = isGutter ? 2.5 : 13;
  }

  for(let row=0; row<rows; row++){
    const excelRow = row + 1;
    wsSeat.getRow(excelRow).height = 32;
    for(let col=0; col<cols; col++){
      const seatIdx = seatIndexAt(row, col, currentLayout);
      const seat = seats[seatIdx];
      let text = '';
      if(seat.unused) text = '미사용';
      else if(seat.studentIdx !== null && roster[seat.studentIdx]){
        const st = roster[seat.studentIdx];
        text = `${st.no} ${st.name}`.trim();
      }
      const cell = wsSeat.getCell(excelRow, colPos[col]);
      cell.value = text;
      cell.alignment = centerMid;
      cell.border = allBorder;
      cell.font = {bold:true, size:11};
    }
  }

  const podiumRow = rows + 1;
  wsSeat.getRow(podiumRow).height = 24;
  let startIdx, endIdx;
  if(currentLayout === 'pairs'){ startIdx = 2; endIdx = 3; }
  else if(currentLayout === 'solo6'){ startIdx = 2; endIdx = 3; }
  else { startIdx = 1; endIdx = 3; } // solo5
  const startCol = colPos[startIdx], endCol = colPos[endIdx];
  if(endCol > startCol) wsSeat.mergeCells(podiumRow, startCol, podiumRow, endCol);
  const podCell = wsSeat.getCell(podiumRow, startCol);
  podCell.value = '교탁';
  podCell.alignment = centerMid;
  podCell.border = allBorder;
  podCell.font = {bold:true};

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (titleInput.value.trim() || '자리배치표') + '.xlsx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------------- print ---------------- */
function buildPrintArea(){
  document.getElementById('printTitle').textContent = titleInput.value.trim() || '자리배치표';

  const grade = document.getElementById('gradeInput').value.trim();
  const cls = document.getElementById('classInput').value.trim();
  const teacher = document.getElementById('teacherInput').value.trim();
  let metaHtml = '';
  if(grade || cls) metaHtml += `<span>${grade}${grade?'학년 ':''}${cls}${cls?'반':''}</span>`;
  if(teacher) metaHtml += `<span>담임: ${escapeAttr(teacher)}</span>`;
  document.getElementById('printMeta').innerHTML = metaHtml || '<span>&nbsp;</span>';

  const rows = rowsOfLayout(currentLayout);
  const printGrid = document.getElementById('printGrid');
  printGrid.style.gridTemplateColumns = currentLayout === 'pairs'
    ? '1fr 1fr 7mm 1fr 1fr 7mm 1fr 1fr'
    : `repeat(${colsOfLayout(currentLayout)}, 1fr)`;
  const ROSTER_ROW_MM = 4.6;
  const rowH = (16 * ROSTER_ROW_MM / rows).toFixed(2) + 'mm';
  printGrid.style.gridTemplateRows = `repeat(${rows}, ${rowH}) 7mm 17mm`;

  let gridHtml = '';
  for(let i=0;i<SEAT_COUNT;i++){
    const seat = seats[i];
    const col = seatColOf(i), row = seatRowOf(i);
    let cls2 = 'print-seat' + (seat.unused ? ' unused' : '');
    let inner = '';
    if(seat.unused){
      inner = '';
    } else if(seat.studentIdx !== null && roster[seat.studentIdx] && roster[seat.studentIdx].name){
      const st = roster[seat.studentIdx];
      const label = st.no ? `${escapeAttr(st.no)} ${escapeAttr(st.name)}` : escapeAttr(st.name);
      inner = `<div class="p-name g-${st.gender}">${label}</div>`;
    }
    gridHtml += `<div class="${cls2}" style="grid-column:${col};grid-row:${row};">${inner}</div>`;
  }
  const pod = podiumGridArea(currentLayout);
  gridHtml += `<div class="print-podium" style="grid-column:${pod.col};grid-row:${pod.row};">교 탁</div>`;
  printGrid.innerHTML = gridHtml;

  const cellOrNbsp = v => { const s = (v||'').toString().trim(); return s === '' ? '&nbsp;' : escapeAttr(s); };
  let rosterHtml = '';
  roster.forEach(st => {
    rosterHtml += `<tr><td>${cellOrNbsp(st.no)}</td><td class="name-cell">${cellOrNbsp(st.name)}</td><td>${cellOrNbsp(st.gender)}</td></tr>`;
  });
  document.getElementById('printRosterBody').innerHTML = rosterHtml;
}
function printChart(){
  buildPrintArea();
  window.print();
}

/* ---------------- init ---------------- */
renderRoster();
renderSeats();
</script>
